<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Glass Bot: a frosted-glass visor with two glowing eyes over a violet-to-teal gradient. -->
  <defs>
    <clipPath id="r"><rect width="1024" height="1024" rx="224"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6A52F5"/><stop offset="1" stop-color="#2CD2B2"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.62"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.22"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.35"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#1B1050" flood-opacity="0.35"/></filter>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle cx="290" cy="300" r="230" fill="#FF7A58" opacity="0.85"/>
      <circle cx="780" cy="780" r="280" fill="#8F7BFF" opacity="0.9"/>
      <circle cx="820" cy="240" r="160" fill="#FFFFFF" opacity="0.25"/>
    </g>
  </g>
  <g filter="url(#lift)">
    <rect x="212" y="372" width="600" height="280" rx="140" fill="url(#glass)"/>
    <rect x="215" y="375" width="594" height="274" rx="137" fill="none" stroke="url(#edge)" stroke-width="6"/>
  </g>
  <g fill="#FFFFFF" filter="url(#glow)">
    <circle cx="402" cy="512" r="48"/>
    <circle cx="622" cy="512" r="48"/>
  </g>
  <line x1="512" y1="372" x2="512" y2="304" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" opacity="0.95"/>
  <circle cx="512" cy="276" r="28" fill="#FFFFFF" filter="url(#glow)"/>
</svg>
