<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Monogram: a bold A that is also an upward arrow, warm gradient on grained charcoal, spark at the apex. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="85%"><stop offset="0" stop-color="#26272F"/><stop offset="1" stop-color="#0C0D11"/></radialGradient>
    <linearGradient id="a" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FF7A58"/><stop offset="1" stop-color="#FF3D9A"/></linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#000000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" filter="url(#grain)"/>
  <g filter="url(#lift)">
    <path d="M512 262 L 826 790 L 702 790 L 512 466 L 322 790 L 198 790 Z" fill="url(#a)"/>
    <rect x="424" y="648" width="176" height="62" rx="31" fill="#FFFFFF"/>
  </g>
  <path d="M512 118 c7 44 22 60 66 68 c-44 8 -59 24 -66 68 c-7 -44 -22 -60 -66 -68 c44 -8 59 -24 66 -68 z" fill="#FFFFFF" filter="url(#glow)"/>
</svg>
