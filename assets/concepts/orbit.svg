<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Orbit: a luminous open ring with the agent as a bright orb on its path, circling a goal. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%"><stop offset="0" stop-color="#1B2046"/><stop offset="1" stop-color="#06091A"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8F7BFF"/><stop offset="0.55" stop-color="#FF7A58"/><stop offset="1" stop-color="#2CD2B2"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="20" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="haze" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="70"/></filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="url(#ring)" stroke-width="70" opacity="0.32" filter="url(#haze)"/>
  <path d="M512 212 A300 300 0 1 1 252 362" fill="none" stroke="url(#ring)" stroke-width="36" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="252" cy="362" r="48" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="512" cy="512" r="84" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.22"/>
  <circle cx="512" cy="512" r="30" fill="#FFFFFF" opacity="0.95"/>
</svg>
